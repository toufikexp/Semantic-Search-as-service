[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "semantic-search-api"
version = "1.0.0"
description = "Semantic Search as a Service Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: search quality evaluation tests using golden dataset and ranking metrics",
    "integration: end-to-end pipeline tests across API boundaries",
    "security: security-focused tests (auth, injection, rate limiting)",
    "performance: latency and concurrency benchmarks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
