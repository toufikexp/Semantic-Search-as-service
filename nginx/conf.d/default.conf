upstream search_api {
    least_conn;
    server search-api:8000;
}

upstream ingestion_api {
    least_conn;
    server ingestion-api:8001;
}

upstream cv_api {
    least_conn;
    server cv-api:8001;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cv_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request size limits
    client_max_body_size 50M;

    # Nginx own health (used by Docker healthcheck, no upstream dependency)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Health check (no auth required)
    location /health {
        proxy_pass http://search_api/health;
    }

    # Search API routes
    location /api/v1/collections {
        limit_req zone=search_limit burst=50 nodelay;

        proxy_pass http://search_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts – must exceed the embedding query timeout (15s)
        # so the API can fall back to keyword search before nginx gives up.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Ingestion-specific routes (documents, webhooks, crawl)
    location ~ ^/api/v1/collections/[^/]+/documents {
        limit_req zone=ingest_limit burst=20 nodelay;

        proxy_pass http://ingestion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        client_max_body_size 100M;
    }

    location ~ ^/api/v1/collections/[^/]+/(webhooks|crawl) {
        limit_req zone=ingest_limit burst=10 nodelay;

        proxy_pass http://ingestion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
    }

    # Job status
    location /api/v1/jobs {
        proxy_pass http://ingestion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === CV Layer routes (paths preserved as-is) ===

    location = /ready {
        proxy_pass http://cv_api/ready;
        proxy_set_header Host $host;
    }

    location /api/v1/candidates {
        limit_req zone=cv_limit burst=20 nodelay;

        proxy_pass http://cv_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        client_max_body_size 50M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/v1/collections/[^/]+/candidates {
        limit_req zone=cv_limit burst=20 nodelay;

        proxy_pass http://cv_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        client_max_body_size 50M;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    location = /api/webhooks/ingestion {
        proxy_pass http://cv_api/api/webhooks/ingestion;
        proxy_set_header Host $host;
        proxy_set_header X-Webhook-Signature $http_x_webhook_signature;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    # API documentation
    location /docs {
        proxy_pass http://search_api/docs;
    }

    location /redoc {
        proxy_pass http://search_api/redoc;
    }

    location /openapi.json {
        proxy_pass http://search_api/openapi.json;
    }

    # Prometheus metrics (restrict in production)
    location /metrics {
        proxy_pass http://search_api/metrics;
    }
}
